syntax = "proto3";

package ai_inference;

service AIInference {
  rpc SentimentAnalysis(SentimentRequest) returns (SentimentResponse);
  rpc RealTimeLLMGeneration(LLMRequest) returns (stream LLMResponse);
  rpc BatchSummarization(stream SummarizationChunk) returns (SummarizationResponse);
  rpc LiveChatAssistant(stream ChatMessage) returns (stream ChatMessage);
}

message SentimentRequest {
  string text = 1;
}

message SentimentResponse {
  string label = 1;
  float confidence = 2;
}

message LLMRequest {
  string prompt = 1;
}

message LLMResponse {
  string token = 1;
}

message SummarizationChunk {
  string chunk = 1;
}

message SummarizationResponse {
  string summary = 1;
}

message ChatMessage {
  string message = 1;
}